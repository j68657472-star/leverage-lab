services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etf
      POSTGRES_PASSWORD: etf
      POSTGRES_DB: etf_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etf"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://etf:etf@db:5432/etf_lab
      CORS_ORIGINS: http://localhost:3000
      PRICE_PROVIDERS: yfinance,stooq
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pricecache:/app/.price_cache

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  pricecache:
